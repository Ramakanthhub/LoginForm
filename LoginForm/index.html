
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Login Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #dbeafe, #eff6ff, #bfdbfe);
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(37, 99, 235, 0.18);
        }

        .logo {
            width: 65px;
            height: 65px;
            background: #dbeafe;
            color: #2563eb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin: 0 auto 15px;
        }

        h1 {
            text-align: center;
            color: #1e293b;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 28px;
        }

        label {
            display: block;
            color: #334155;
            font-weight: bold;
            margin: 15px 0 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px #dbeafe;
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 65px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            color: #2563eb;
            cursor: pointer;
            font-size: 13px;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 18px 0;
            font-size: 13px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .remember input {
            width: auto;
        }

        a {
            color: #2563eb;
            text-decoration: none;
        }

        button.login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button.login-btn:hover {
            background: #1d4ed8;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            font-weight: bold;
            font-size: 14px;
        }

        .footer {
            text-align: center;
            margin-top: 22px;
            color: #64748b;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <div class="logo">🔒</div>

        <h1>Welcome Back!</h1>
        <p class="subtitle">Please login to your account</p>

        <form onsubmit="validateLogin(event)">

            <label for="username">Username</label>
            <input type="text" id="username"
                   placeholder="Enter your username">

            <label for="password">Password</label>

            <div class="password-box">
                <input type="password" id="password"
                       placeholder="Enter your password">

                <button type="button" class="toggle-password"
                        onclick="togglePassword()">Show</button>
            </div>

            <div class="options">
                <label class="remember">
                    <input type="checkbox"> Remember me
                </label>
                <a href="#" onclick="alert('Contact administrator to reset your password.'); return false;">Forgot Password?</a>
            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

            <p id="message" role="status" aria-live="polite"></p>

        </form>

        <div class="footer">
            Don't have an account? <a href="#" onclick="alert('Registration is not enabled in this demo.'); return false;">Sign Up</a>
        </div>

    </div>

    <script>
        function validateLogin(event) {
            event.preventDefault();

            let username = document.getElementById("username").value.trim();
            let password = document.getElementById("password").value;
            let message = document.getElementById("message");

            if (username === "" || password === "") {
                message.style.color = "red";
                message.innerHTML = "Please fill in all fields!";
            }
            else if (username === "admin" && password === "12345") {
                message.style.color = "green";
                message.innerHTML = "Login Successful!";
            }
            else {
                message.style.color = "red";
                message.innerHTML = "Invalid Username or Password!";
            }
        }

        function togglePassword() {
            let password = document.getElementById("password");
            let toggle = document.querySelector(".toggle-password");

            if (password.type === "password") {
                password.type = "text";
                toggle.innerHTML = "Hide";
            } else {
                password.type = "password";
                toggle.innerHTML = "Show";
            }
        }
    </script>

</body>
</html>
